device:
  device_id: "ccssite02"
  friendly_name: "Baustellenkoffer 2"
  phidget_serial: 802547

server:
  ingest_url: "https://telemetry.concretum-setting.com/api/v1/telemetry/ingest"
  api_token: "DeinGeheimerApiToken456!"
  batch_size: 10              # Paketgröße (5-10 Datensätze pro Request)
  sync_interval_sec: 5.0

ntfy:
  server_url: "https://ntfy.concretum-setting.com"
  location_channel: "Concretum"
  admin_channel: "Admin"

network:
  ping_target: "1.1.1.1"
  check_interval_sec: 15
  hotspot_fallback_min: 5

sensors:
  - port: 0
    type: "humidity_temp"
    label: "Umgebung"
  - port: 1
    type: "tc_4port"
    label: "Temp"
